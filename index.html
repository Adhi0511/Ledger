<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2457c5">
<title>Adhi's Expense Tracker</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#16202e;--mute:#667085;--line:#dde3ec;--bank:#2457c5;--cash:#16845a;--out:#c4412c;--soft:#e6ecf8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1520;--card:#18212f;--ink:#e8edf5;--mute:#93a0b4;--line:#27334a;--bank:#6e9bff;--cash:#4cc58f;--out:#ff8a73;--soft:#202c42}}
:root[data-theme="dark"]{--bg:#0f1520;--card:#18212f;--ink:#e8edf5;--mute:#93a0b4;--line:#27334a;--bank:#6e9bff;--cash:#4cc58f;--out:#ff8a73;--soft:#202c42}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:13px;font-weight:600;color:var(--mute);margin:4px 0 2px}
h2{font-size:15px;margin:22px 0 8px}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pill{border-radius:10px;padding:10px 12px;background:var(--soft)}
.pill b{display:block;font-size:19px}.pill span{font-size:12px;color:var(--mute)}
.cashp{background:color-mix(in srgb,var(--cash) 14%,var(--card))}.cashp b{color:var(--cash)}
.bankp b{color:var(--bank)}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--mute);display:block}
.bar{width:4px;border-radius:2px;align-self:stretch;margin-right:10px;flex:none}
.l{display:flex;flex:1;min-width:0}.l div{min-width:0}.l b,.l small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.out{color:var(--out)}.in{color:var(--cash)}.tr{color:var(--bank)}
button,select,input,textarea{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px}
label{display:block;font-size:12px;color:var(--mute);margin-top:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;background:var(--bank);color:#fff;font-weight:600;width:100%;margin-top:14px;cursor:pointer}
.btn.alt{background:var(--soft);color:var(--ink)}
.lnk{background:none;border:0;color:var(--mute);font-size:12px;cursor:pointer;padding:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr 1fr;align-items:center;gap:4px}
nav button{background:none;border:0;padding:10px 4px;color:var(--mute);font-size:12.5px;cursor:pointer}
nav button.on{color:var(--bank);font-weight:700}
.fab{width:54px;height:54px;border-radius:50%;background:var(--bank)!important;color:#fff!important;font-size:30px!important;line-height:1;padding:0!important;margin:-22px 6px 0}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--soft);padding:4px;border-radius:12px}
.seg button{border:0;background:none;padding:9px 2px;border-radius:9px;font-size:13px;cursor:pointer}
.seg button.on{background:var(--card);font-weight:700}
.sheet{position:fixed;inset:0;background:rgba(10,15,25,.5);display:none;align-items:flex-end;z-index:5}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-width:480px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.amt{font-size:28px!important;font-weight:700}
.den{display:grid;grid-template-columns:60px 1fr 80px;gap:8px;align-items:center;padding:4px 0}
.den input{margin:0;padding:8px}.den span:last-child{text-align:right}
.empty{color:var(--mute);padding:14px 0;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{overflow-x:auto}
.citem{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:6px;cursor:pointer}.citem.add{color:var(--bank);font-weight:600}
.catbtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:4px;text-align:left;cursor:pointer}#cl{max-height:50vh;overflow:auto;margin-top:6px}
.tplrow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.tplrow button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:13px}

.seg{grid-template-columns:repeat(5,1fr)}.seg button{font-size:11.5px}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}.den2{display:flex;align-items:center;gap:6px;justify-content:space-between}.den2 span{font-size:12.5px}.den2 input{width:64px;margin:0;padding:6px 8px;text-align:center}

nav button{font-size:12px;padding:10px 2px}
.rb{height:7px;background:var(--soft);border-radius:4px;margin-top:5px;overflow:hidden}.rb i{display:block;height:100%;background:var(--out);border-radius:4px}.rb.g i{background:var(--cash)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{background:var(--soft);border-radius:999px;padding:3px 4px 3px 12px;font-size:13px}

.lock{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:6px}.lock.show{display:flex}.lock input{max-width:240px;text-align:center;font-size:24px;letter-spacing:.3em}.lock .btn{max-width:240px}#lerr{color:var(--out);min-height:20px;font-size:13px}
</style></head>
<body>
<div class="lock" id="lock"><h2 style="margin:0">Adhi's Expense Tracker</h2><div style="color:var(--mute)">Enter your PIN</div><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off" onkeydown="if(event.key==='Enter')tryUnlock()"><div id="lerr"></div><button class="btn alt" id="lbio" style="display:none" onclick="bioUnlock()">Use fingerprint</button><button class="btn" onclick="tryUnlock()">Unlock</button><button class="lnk" onclick="forgot()">Forgot PIN?</button></div>
<main id="app"></main>
<nav><div>
<button data-t="home">Home</button><button data-t="hist">History</button>
<button class="fab" onclick="openAdd()" aria-label="Add entry">+</button>
<button data-t="cash">Cash</button><button data-t="rep">Reports</button><button data-t="acc">More</button>
</div></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script>
var KEY="pocket_ledger_v1",S,tab="home",F={m:"",a:""},kill=null,mode="expense";
var CAT=["Food","Groceries","Transport","Fuel","Bills","Rent","Shopping","Health","Entertainment","Work","Other"];
var INC=["Salary","Business","Refund","Other income"];
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 if(!S||!S.accounts){S={accounts:[{id:"c1",name:"Cash in hand",type:"cash",open:0},{id:"b1",name:"Bank account",type:"bank",open:0}],tx:[]}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(n){var s=n<0?"-":"";n=Math.abs(n);return s+"₹"+n.toLocaleString("en-IN",{minimumFractionDigits:Math.round(n*100)%100?2:0,maximumFractionDigits:2})}
function acc(id){return S.accounts.filter(function(a){return a.id===id})[0]}
function bal(id){var b=acc(id).open;S.tx.forEach(function(t){if(t.type==="income"&&t.acc===id)b+=t.amt;if(t.type==="expense"&&t.acc===id)b-=t.amt;if(t.type==="loan"&&t.acc===id)b+=(t.dir==="lent"||t.dir==="paid"?-1:1)*t.amt;if(t.type==="transfer"){if(t.acc===id)b-=t.amt;if(t.to===id)b+=t.amt}});return Math.round(b*100)/100}
function sum(type){return S.accounts.filter(function(a){return a.type===type}).reduce(function(s,a){return s+bal(a.id)},0)}
function mk(d){return d.slice(0,7)}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function kind(t){if(t.type!=="transfer")return t.type;var f=acc(t.acc),o=acc(t.to);if(f&&o){if(f.type==="bank"&&o.type==="cash")return"withdrawal";if(f.type==="cash"&&o.type==="bank")return"deposit"}return"transfer"}
function title0(t){var k=kind(t);if(k==="expense"||k==="income")return t.cat||k;var f=acc(t.acc),o=acc(t.to);return(k==="withdrawal"?"Withdrawal":k==="deposit"?"Cash deposit":"Transfer")+": "+(f?f.name:"?")+" → "+(o?o.name:"?")}
function home0(){var m=mk(today()),sp=0,inc=0;S.tx.forEach(function(t){if(mk(t.date)===m){if(t.type==="expense")sp+=t.amt;if(t.type==="income")inc+=t.amt}});
 var r=sorted().slice(0,6);
 return '<h1>Total balance</h1><div class="big">'+fmt(sum("bank")+sum("cash"))+'</div>'+
 '<div class="split"><div class="pill cashp"><span>Cash in hand</span><b>'+fmt(sum("cash"))+'</b></div><div class="pill bankp"><span>In banks</span><b>'+fmt(sum("bank"))+'</b></div></div>'+
 '<div class="split"><div class="pill"><span>Spent this month</span><b class="out">'+fmt(sp)+'</b></div><div class="pill"><span>Income this month</span><b class="in">'+fmt(inc)+'</b></div></div>'+
 '<h2>Accounts</h2><div class="card">'+S.accounts.map(function(a){return'<div class="item"><div><b>'+esc(a.name)+'</b><small>'+(a.type==="cash"?"Cash":"Bank")+'</small></div><b>'+fmt(bal(a.id))+'</b></div>'}).join("")+'</div>'+
 '<h2>Recent</h2><div class="card">'+(r.length?r.map(function(t){return row(t)}).join(""):'<div class="empty">No entries yet. Tap + to add your first expense, income or withdrawal.</div>')+'</div>'}
function del(id){if(kill===id){S.tx=S.tx.filter(function(t){return t.id!==id});kill=null;save()}else kill=id;render()}
var D=[500,200,100,50,20,10,5,2,1],cashSel="";
function accT0(){return '<h1>Accounts</h1><div class="card">'+S.accounts.map(function(a){var used=S.tx.some(function(t){return t.acc===a.id||t.to===a.id});
 return'<div class="item"><div><b>'+esc(a.name)+'</b><small>'+(a.type==="cash"?"Cash":"Bank")+' · opened with '+fmt(a.open)+'</small></div><div style="text-align:right"><b>'+fmt(bal(a.id))+'</b>'+(used?"":'<br><button class="lnk" onclick="delAcc(\''+a.id+'\')">Remove</button>')+'</div></div>'}).join("")+'</div>'+
 '<h2>Add account</h2><div class="card"><label>Name</label><input id="an" placeholder="e.g. SBI Savings, Wallet"><label>Type</label><select id="at"><option value="bank">Bank account</option><option value="cash">Cash</option></select><label>Current balance (₹)</label><input id="ao" type="number" inputmode="decimal" placeholder="0"><button class="btn" onclick="addAcc()">Add account</button></div>'+
 '<h2>Backup</h2><div class="card"><div style="color:var(--mute);font-size:13px">Your data is stored only in this browser. Copy a backup now and then, and paste it back here to restore.</div><textarea id="bk" rows="3" placeholder="Backup text appears here"></textarea><div class="two"><button class="btn alt" onclick="bkCopy()">Copy backup</button><button class="btn alt" onclick="bkRestore()">Restore</button></div></div>'}
function addAcc(){var n=document.getElementById("an").value.trim();if(!n)return alert("Enter an account name.");S.accounts.push({id:uid(),name:n,type:document.getElementById("at").value,open:+document.getElementById("ao").value||0});save();render()}
function delAcc(id){S.accounts=S.accounts.filter(function(a){return a.id!==id});save();render()}
function opts(arr,sel){return arr.map(function(a){return'<option value="'+a.id+'"'+(a.id===sel?" selected":"")+'>'+esc(a.name)+'</option>'}).join("")}
document.getElementById("sheet").addEventListener("click",function(e){if(e.target.id==="sheet")closeSheet()});
document.querySelector("nav").addEventListener("click",function(e){var t=e.target.dataset&&e.target.dataset.t;if(t){tab=t;kill=null;R.c=null;PP=null;render();window.scrollTo(0,0)}});

var PK="pocket_ledger_pin",fails=0,until=0,hiddenAt=0;
function getPin(){try{return JSON.parse(localStorage.getItem(PK))}catch(e){return null}}
async function hp(p,salt){var k=await crypto.subtle.importKey("raw",new TextEncoder().encode(p),"PBKDF2",false,["deriveBits"]);var b=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256);return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
function lerr(m){document.getElementById("lerr").textContent=m}
async function tryUnlock(){if(Date.now()<until)return lerr("Too many tries. Wait 30 seconds.");var p=getPin(),v=document.getElementById("lp").value;
 if(p&&await hp(v,p.s)===p.h){fails=0;document.getElementById("lock").classList.remove("show");document.getElementById("lp").value="";lerr("")}
 else{fails++;if(fails>=5){until=Date.now()+30000;fails=0;lerr("Too many tries. Wait 30 seconds.")}else lerr("Wrong PIN");document.getElementById("lp").value=""}}
function forgot(){if(confirm("Forgot PIN? This erases all data on this device. You can restore from a backup afterwards.")){try{localStorage.removeItem(KEY);localStorage.removeItem(PK);localStorage.removeItem("pocket_ledger_bio")}catch(e){}location.reload()}}
function secCard0(){var on=!!getPin();return'<h2>Security</h2><div class="card"><div style="color:var(--mute);font-size:13px">'+(on?"PIN lock is on. The app locks after 30 seconds away.":"Set a 4 to 8 digit PIN so only you can open the app.")+'</div>'+(on?'<label>Current PIN</label><input id="pc" type="password" inputmode="numeric" maxlength="8">':"")+'<label>'+(on?"New PIN (leave empty to remove the lock)":"New PIN")+'</label><input id="pn" type="password" inputmode="numeric" maxlength="8"><button class="btn" onclick="chPin()">'+(on?"Update PIN":"Set PIN")+'</button></div>'}
async function chPin(){var p=getPin(),n=document.getElementById("pn").value;
 if(p&&await hp(document.getElementById("pc").value,p.s)!==p.h)return alert("Current PIN is wrong.");
 if(n===""){if(!p)return alert("Enter a PIN.");localStorage.removeItem(PK);localStorage.removeItem("pocket_ledger_bio");render();return alert("PIN lock removed.")}
 if(!/^\d{4,8}$/.test(n))return alert("Use 4 to 8 digits.");
 var s=uid()+uid();localStorage.setItem(PK,JSON.stringify({s:s,h:await hp(n,s)}));render();alert("PIN saved.")}
document.addEventListener("visibilitychange",function(){if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>30000)showLock()});
if("serviceWorker"in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
/* v2: edit entries, categories, reports, search */
var editId=null,R={m:""};
function bkNudge(){var b=0;try{b=+localStorage.getItem("pl_bk")||0}catch(e){}if(Date.now()-b<6048e5||!S.tx.length)return"";return'<div class="card" style="margin-bottom:10px;border-color:var(--out)"><b>Back up your data</b><div style="color:var(--mute);font-size:13px">No backup in the last 7 days. Go to More, then Download backup file, or share it to Google Drive.</div></div>'}
function sorted(){return S.tx.map(function(t,i){return{t:t,i:i}}).sort(function(a,b){return a.t.date<b.t.date?1:a.t.date>b.t.date?-1:b.i-a.i}).map(function(x){return x.t})}
function row(t,del){var k=kind(t),ln=t.type==="loan",lo=ln&&(t.dir==="lent"||t.dir==="paid"),li=ln&&!lo,c=(k==="expense"||lo)?"out":(k==="income"||li)?"in":"tr",a=acc(t.acc),sg=(k==="expense"||lo)?"-":(k==="income"||li)?"+":"";
 return'<div class="item"><div class="l"'+(del?' onclick="editTx(\''+t.id+'\')" style="cursor:pointer"':"")+'><i class="bar" style="background:var(--'+(c==="out"?"out":c==="in"?"cash":"bank")+')"></i><div><b>'+esc(title(t))+'</b><small>'+esc(t.date)+(k==="expense"||k==="income"||ln?" · "+esc(a?a.name:""):"")+(t.note?" · "+esc(t.note):"")+'</small></div></div><div style="text-align:right"><b class="'+c+'">'+sg+fmt(t.amt)+'</b>'+(del?'<br><button class="lnk" onclick="editTx(\''+t.id+'\')">Edit</button> · <button class="lnk" onclick="del(\''+t.id+'\')">'+(kill===t.id?"Tap again to delete":"Delete")+'</button>':"")+'</div></div>'}
function hfilter(){var q=(F.q||"").toLowerCase();return sorted().filter(function(t){return(!F.m||mk(t.date)===F.m)&&(!F.a||t.acc===F.a||t.to===F.a)&&(!q||(title(t)+" "+(t.note||"")+" "+t.amt).toLowerCase().indexOf(q)>=0)})}
function hbody(){var l=hfilter(),o=0,n=0;l.forEach(function(t){if(t.type==="expense")o+=t.amt;if(t.type==="income")n+=t.amt});
 return'<p style="color:var(--mute);margin:12px 0 0">'+l.length+' entries · spent <b class="out">'+fmt(o)+'</b> · income <b class="in">'+fmt(n)+'</b></p><div class="card" style="margin-top:8px">'+(l.length?l.map(function(t){return row(t,1)}).join(""):'<div class="empty">Nothing matches.</div>')+'</div>'}
function hist(){var ms={};S.tx.forEach(function(t){ms[mk(t.date)]=1});var mm=Object.keys(ms).sort().reverse();
 return'<h1>History</h1><div class="two"><select onchange="F.m=this.value;render()"><option value="">All months</option>'+mm.map(function(m){return'<option value="'+m+'"'+(F.m===m?" selected":"")+'>'+m+'</option>'}).join("")+'</select><select onchange="F.a=this.value;render()"><option value="">All accounts</option>'+S.accounts.map(function(a){return'<option value="'+a.id+'"'+(F.a===a.id?" selected":"")+'>'+esc(a.name)+'</option>'}).join("")+'</select></div><input placeholder="Search note, category or amount" value="'+esc(F.q||"")+'" oninput="F.q=this.value;document.getElementById(\'hl\').innerHTML=hbody()" style="margin-top:10px"><div id="hl">'+hbody()+'</div>'}
function render(){document.querySelectorAll("nav [data-t]").forEach(function(b){b.className=b.dataset.t===tab?"on":""});
 var h=tab==="home"?home():tab==="hist"?hist():tab==="cash"?cashT():tab==="rep"?rep():tab==="ppl"?ppl():accT();var s=window.scrollY;document.getElementById("app").innerHTML=h;window.scrollTo(0,s);if(tab==="acc")stgInfo()}
function openAdd(m){editId=null;mode=m==="withdraw"?"withdraw":m==="deposit"?"deposit":(m||mode);sheet()}
function sheet0(e){e=e||{};var banks=S.accounts.filter(function(a){return a.type==="bank"}),cash=S.accounts.filter(function(a){return a.type==="cash"}),all=S.accounts,ed=!!editId,m=ed?e.type:mode,h;
 h=ed?'<h2 style="margin:0">Edit entry</h2>':'<div class="seg">'+[["expense","Expense"],["income","Income"],["transfer","Transfer"],["withdraw","Withdraw"],["deposit","Deposit"]].map(function(x){return'<button class="'+((m===x[0]||false)?"on":"")+'" onclick="mode=\''+x[0]+'\';sheet()">'+x[1]+'</button>'}).join("")+'</div>';
 h+='<label>Amount (₹)</label><input class="amt" id="f_amt" type="number" inputmode="decimal" placeholder="0" value="'+(e.amt||"")+'">';
 if(m==="expense"||m==="income"){var cl=S.cats[m==="income"?"inc":"exp"].slice();if(e.cat&&cl.indexOf(e.cat)<0)cl.push(e.cat);
  h+='<label>'+(m==="expense"?"Paid from":"Received in")+'</label><select id="f_acc">'+opts(all,e.acc||(cash[0]&&cash[0].id))+'</select><label>Category</label><select id="f_cat" onchange="catSel(this)">'+cl.map(function(c){return'<option'+(c===e.cat?" selected":"")+'>'+esc(c)+'</option>'}).join("")+'<option value="__new">+ New category…</option></select>'}
 else{var wd=m==="withdraw"&&!ed,dp=m==="deposit"&&!ed,from=wd?banks:dp?cash:all,to=wd?cash:dp?banks:all,fs=ed?e.acc:m==="deposit"?(cash[0]&&cash[0].id):(from[0]&&from[0].id),ts=ed?e.to:m==="deposit"?(banks[0]&&banks[0].id):(to[0]&&to[0].id);
  if(m==="transfer"&&!ed&&all.length>1&&fs===ts)ts=all[1].id;
  h+='<label>From</label><select id="f_acc">'+opts(from,fs)+'</select><label>To</label><select id="f_to">'+opts(to,ts)+'</select>'+(ed?"":'<label>Fee or charges (₹, optional)</label><input id="f_fee" type="number" inputmode="decimal" placeholder="0">')}
 h+='<label>Date</label><input id="f_date" type="date" value="'+(e.date||today())+'"><label>Note (optional)</label><input id="f_note" value="'+esc(e.note||"")+'" placeholder="What was it for?"><button class="btn" onclick="submitTx()">'+(ed?"Save changes":"Save")+'</button><button class="btn alt" onclick="closeSheet()">Cancel</button>';

function tplCard(){return'<h2>Quick entries</h2><div class="card">'+(S.tpl.length?S.tpl.map(function(t){return'<div class="item"><div><b>'+esc(t.name)+'</b><small>'+(t.amt?fmt(t.amt):"No amount")+(t.cat?" · "+esc(t.cat):"")+'</small></div><button class="lnk" onclick="tplDel(\''+t.id+'\')">Remove</button></div>'}).join(""):'<div class="empty">None yet. Fill in the + screen and tap Save as quick entry.</div>')+'</div>'}
function recDue(r){var y=+r.last.slice(0,4),m=+r.last.slice(5,7)+1;if(m>12){m=1;y++}var d=Math.min(r.day,new Date(y,m,0).getDate()),mm=y+"-"+String(m).padStart(2,"0"),ds=mm+"-"+String(d).padStart(2,"0");return ds<=today()?{m:mm,date:ds}:null}
function recGet(id){return S.rec.filter(function(r){return r.id===id})[0]}
function dueCard(){var h="";S.rec.forEach(function(r){var d=recDue(r);if(d)h+='<div class="item"><div><b>'+esc(r.name)+'</b><small>Due '+d.date+' · '+fmt(r.amt)+'</small></div><div style="text-align:right"><button class="lnk" onclick="recAdd(\''+r.id+'\')">Add</button> · <button class="lnk" onclick="recSkip(\''+r.id+'\')">Skip</button></div></div>'});return h?'<div class="card" style="margin-bottom:10px"><b>Recurring entries due</b>'+h+'</div>':""}
function recAdd(id){var r=recGet(id),d=r&&recDue(r);if(!d)return;editId=null;mode=r.type;sheet({amt:r.amt,acc:r.acc,cat:r.cat,note:r.note,date:d.date});recPend={id:id,m:d.m}}
function recSkip(id){var r=recGet(id),d=r&&recDue(r);if(d){r.last=d.m;save();render()}}
function recDel(id){S.rec=S.rec.filter(function(r){return r.id!==id});save();render()}
function recNew(){var n=document.getElementById("rn").value.trim(),a=+document.getElementById("ra").value,d=Math.floor(+document.getElementById("rd").value);if(!n||!(a>0)||d<1||d>31)return alert("Enter a name, an amount above 0, and a day of the month from 1 to 31.");
 S.rec.push({id:uid(),name:n,type:document.getElementById("rt").value,amt:a,acc:document.getElementById("rac").value,cat:document.getElementById("rc").value,note:"",day:d,last:mk(today())});save();render()}
function recCard(){return'<h2>Recurring entries</h2><div class="card">'+(S.rec.length?S.rec.map(function(r){return'<div class="item"><div><b>'+esc(r.name)+'</b><small>'+(r.type==="income"?"Income":"Expense")+' · '+fmt(r.amt)+' · day '+r.day+(r.cat?" · "+esc(r.cat):"")+'</small></div><button class="lnk" onclick="recDel(\''+r.id+'\')">Remove</button></div>'}).join(""):'<div class="empty">None yet. Add rent, EMI, subscriptions or salary.</div>')+
 '<label>Name</label><input id="rn" placeholder="e.g. Rent"><div class="two"><div><label>Type</label><select id="rt"><option value="expense">Expense</option><option value="income">Income</option></select></div><div><label>Day of month</label><input id="rd" type="number" min="1" max="31" inputmode="numeric" placeholder="1"></div></div><div class="two"><div><label>Amount (₹)</label><input id="ra" type="number" inputmode="decimal"></div><div><label>Account</label><select id="rac">'+opts(S.accounts,"")+'</select></div></div><label>Category</label><select id="rc">'+S.cats.exp.concat(S.cats.inc).map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'</select><button class="btn" onclick="recNew()">Add recurring entry</button><div style="color:var(--mute);font-size:12px;margin-top:8px">You get a reminder on Home when it is due, starting next month. You confirm each one.</div></div>'}
function bkName(){return"expense-tracker-backup-"+today()+".json"}
function bkMark(){try{localStorage.setItem("pl_bk",String(Date.now()))}catch(e){}}
function bkDownload(){var b=new Blob([JSON.stringify(S)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=bkName();document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);bkMark()}
function bkShare(){var f=new File([JSON.stringify(S)],bkName(),{type:"application/json"});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:"Expense tracker backup"}).then(bkMark).catch(function(){})}else alert("Sharing is not available here. Use Download instead.")}
function bkFile(inp){var f=inp.files&&inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(!d.accounts||!d.tx)throw 0;if(!confirm("Replace all current data with this backup?"))return;S=d;fix();save();render();alert("Restored.")}catch(e){alert("That file is not a valid backup.")}};r.readAsText(f);inp.value=""}
function fileCard(){return'<h2>Backup file</h2><div class="card"><div style="color:var(--mute);font-size:13px">Save a backup file to your phone or Google Drive. Restoring replaces your current data.</div><div class="two"><button class="btn" onclick="bkDownload()">Download</button><button class="btn alt" onclick="bkShare()">Share / Save to Drive</button></div><label>Restore from a backup file</label><input type="file" accept=".json,application/json" onchange="bkFile(this)"><div id="stg" style="color:var(--mute);font-size:12px;margin-top:8px"></div></div>'}
function stgInfo(){var el=document.getElementById("stg");if(!el||!navigator.storage||!navigator.storage.persisted)return;navigator.storage.persisted().then(function(p){el.textContent=p?"Storage protection: on. Android will not clear this app's data automatically.":"Storage protection: not granted. Keep regular backups."})}
/* v5: budgets, report drill-down, lent and borrowed */
var RC=[],PP=null;
function fix(){if(!S.cats)S.cats={};if(!S.cats.exp)S.cats.exp=CAT.slice();if(!S.cats.inc)S.cats.inc=INC.slice();if(!S.wallet)S.wallet={};if(!S.tpl)S.tpl=[];if(!S.rec)S.rec=[];if(!S.bud)S.bud={};if(!S.ppl)S.ppl=[]}
function budSp(c,m){return S.tx.filter(function(t){return t.type==="expense"&&t.cat===c&&mk(t.date)===m}).reduce(function(s,t){return s+t.amt},0)}
function budRep(){var m=R.m||mk(today()),ks=Object.keys(S.bud);if(m==="all"||!ks.length)return"";
 return'<h2>Budgets</h2><div class="card">'+ks.map(function(c){var sp=budSp(c,m),l=S.bud[c],p=sp/l*100;return'<div style="padding:7px 0"><div class="row"><span>'+esc(c)+'</span><b>'+fmt(sp)+' / '+fmt(l)+'</b></div><div class="rb"><i style="width:'+Math.min(100,p)+'%;background:'+(p>100?"var(--out)":p>=80?"#d98a1f":"var(--cash)")+'"></i></div><small style="color:'+(p>100?"var(--out)":"var(--mute)")+'">'+(p>100?"Over by "+fmt(sp-l):fmt(l-sp)+" left")+'</small></div>'}).join("")+'</div>'}
function budCard(){var m=mk(today()),h="";Object.keys(S.bud).forEach(function(c){var sp=budSp(c,m),l=S.bud[c];if(sp>=l*.8)h+='<div class="item"><div><b>'+esc(c)+'</b><small>'+(sp>l?"Over by "+fmt(sp-l):fmt(l-sp)+" left")+' of '+fmt(l)+'</small></div><b class="'+(sp>l?"out":"")+'">'+fmt(sp)+'</b></div>'});return h?'<div class="card" style="margin-bottom:10px"><b>Budget alerts</b>'+h+'</div>':""}
function budMgr(){var ks=Object.keys(S.bud);return'<h2>Budgets</h2><div class="card">'+(ks.length?ks.map(function(c,i){return'<div class="item"><div><b>'+esc(c)+'</b><small>'+fmt(S.bud[c])+' per month</small></div><button class="lnk" onclick="budDel('+i+')">Remove</button></div>'}).join(""):'<div class="empty">No budgets yet.</div>')+'<label>Category</label><select id="bc">'+S.cats.exp.map(function(c){return'<option>'+esc(c)+'</option>'}).join("")+'</select><label>Monthly limit (₹)</label><input id="ba" type="number" inputmode="decimal"><button class="btn" onclick="budSet()">Set budget</button></div>'}
function budSet(){var c=document.getElementById("bc").value,a=+document.getElementById("ba").value;if(!(a>0))return alert("Enter a monthly limit above 0.");S.bud[c]=a;save();render()}
function budDel(i){delete S.bud[Object.keys(S.bud)[i]];save();render()}
function rep(){return R.c?repCat():rep0()+budRep()}
function repCat(){var m=R.m||mk(today()),c=R.c,l=sorted().filter(function(t){return t.type==="expense"&&t.cat===c&&(m==="all"||mk(t.date)===m)}),tot=l.reduce(function(s,t){return s+t.amt},0),pv=m==="all"?null:budSp(c,pm(m)),b=S.bud[c];
 return'<button class="lnk" onclick="R.c=null;render()">← Back to reports</button><h1>'+esc(c)+' · '+(m==="all"?"All time":mname(m))+'</h1><div class="big out">'+fmt(tot)+'</div><p style="color:var(--mute)">'+l.length+' entries'+(pv===null?"":" · last month "+fmt(pv))+(b?" · budget "+fmt(b):"")+'</p><div class="card">'+(l.length?l.map(function(t){return row(t,1)}).join(""):'<div class="empty">No entries.</div>')+'</div>'}
function pBal(id){var b=0;S.tx.forEach(function(t){if(t.type==="loan"&&t.pid===id)b+=(t.dir==="lent"||t.dir==="paid"?1:-1)*t.amt});return b}
function title(t){if(t.type==="loan"){var p=S.ppl.filter(function(x){return x.id===t.pid})[0];return({lent:"Lent to",borrowed:"Borrowed from",got:"Received from",paid:"Paid to"})[t.dir]+" "+(p?p.name:"?")}return title0(t)}
function ppl(){var rc=0,py=0,list=S.ppl.map(function(p){return{p:p,b:pBal(p.id)}});list.forEach(function(x){if(x.b>0)rc+=x.b;else py-=x.b});
 var p=PP&&S.ppl.filter(function(x){return x.id===PP})[0];
 if(p){var b=pBal(p.id),l=sorted().filter(function(t){return t.type==="loan"&&t.pid===p.id});
  return'<button class="lnk" onclick="PP=null;render()">← All people</button><h1>'+esc(p.name)+'</h1><div class="big '+(b>0?"in":b<0?"out":"")+'">'+fmt(Math.abs(b))+'</div><p style="color:var(--mute)">'+(b>0?"owes you":b<0?"you owe them":"settled")+'</p><button class="btn" onclick="loanFor(\''+p.id+'\')">Add entry</button><div class="card" style="margin-top:12px">'+(l.length?l.map(function(t){return row(t,1)}).join(""):'<div class="empty">No entries.</div>')+'</div>'}
 return'<h1>Lent and borrowed</h1><div class="split"><div class="pill cashp"><span>You will receive</span><b>'+fmt(rc)+'</b></div><div class="pill"><span>You need to pay</span><b class="out">'+fmt(py)+'</b></div></div><button class="btn" onclick="loanSheet()">New entry</button><h2>People</h2><div class="card">'+(list.length?list.map(function(x){return'<div class="item" style="cursor:pointer" onclick="PP=\''+x.p.id+'\';render()"><b>'+esc(x.p.name)+'</b><b class="'+(x.b>0?"in":x.b<0?"out":"")+'">'+(x.b>0?"gets ":x.b<0?"you owe ":"")+fmt(Math.abs(x.b))+'</b></div>'}).join(""):'<div class="empty">No entries yet. Tap New entry when you lend or borrow money.</div>')+'</div>'}
function pplBar(){var r=0,p=0;S.ppl.forEach(function(x){var b=pBal(x.id);if(b>0)r+=b;else p-=b});return'<div class="card" style="margin-bottom:10px;cursor:pointer" onclick="tab=\'ppl\';render();window.scrollTo(0,0)"><div class="row"><span>Lent and borrowed</span><span style="color:var(--mute);font-size:13px">'+(r||p?"Receive "+fmt(r)+" · Pay "+fmt(p):"Tap to start")+'</span></div></div>'}
function loanFor(id){var p=S.ppl.filter(function(x){return x.id===id})[0];loanSheet(null,p?p.name:"")}
function loanSheet(t,pn){t=t||{};if(!t.id)editId=null;var dir=t.dir||"lent";mode=(dir==="lent"||dir==="paid")?"expense":"income";
 var h='<h2 style="margin:0">'+(editId?"Edit":"New")+' lent / borrowed entry</h2><label>Person</label><input id="l_n" list="pl" value="'+esc(pn||"")+'" placeholder="Name"><datalist id="pl">'+S.ppl.map(function(p){return'<option value="'+esc(p.name)+'">'}).join("")+'</datalist><label>What happened</label><select id="l_d" onchange="loanDir()">'+[["lent","I lent money"],["borrowed","I borrowed money"],["got","They paid me back"],["paid","I paid them back"]].map(function(o){return'<option value="'+o[0]+'"'+(o[0]===dir?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select><label>Amount (₹)</label><input class="amt" id="f_amt" type="number" inputmode="decimal" oninput="denMsg()" value="'+(t.amt||"")+'"><label>Account</label><select id="f_acc" onchange="denUI()">'+opts(S.accounts,t.acc||"")+'</select><div id="den_box"></div><label>Date</label><input id="f_date" type="date" value="'+(t.date||today())+'"><label>Note (optional)</label><input id="f_note" value="'+esc(t.note||"")+'"><button class="btn" onclick="loanSave()">Save</button><button class="btn alt" onclick="closeSheet()">Cancel</button>';
 document.getElementById("sheetBody").innerHTML=h;document.getElementById("sheet").classList.add("show");denUI()}
function loanDir(){var d=document.getElementById("l_d").value;mode=(d==="lent"||d==="paid")?"expense":"income";denUI()}
function loanSave(){var n=document.getElementById("l_n").value.trim(),amt=+document.getElementById("f_amt").value;if(!n)return alert("Enter the person's name.");if(!(amt>0))return alert("Enter an amount greater than 0.");
 var nd=denNeeds(),use=nd&&!document.getElementById("den_skip").checked;if(use&&!nd.ok)return alert(nd.msg);
 var p=S.ppl.filter(function(x){return x.name.toLowerCase()===n.toLowerCase()})[0];if(!p){p={id:uid(),name:n};S.ppl.push(p)}
 var dir=document.getElementById("l_d").value,ed=editId?S.tx.filter(function(x){return x.id===editId})[0]:null,t={id:ed?ed.id:uid(),type:"loan",dir:dir,pid:p.id,amt:amt,acc:document.getElementById("f_acc").value,date:document.getElementById("f_date").value||today(),note:document.getElementById("f_note").value.trim()};
 if(use){var g=readMap("g_"),c=readMap("c_"),r=readMap("r_");if(dir==="lent"||dir==="paid"){if(dsum(g))t.gv=g;if(dsum(c))t.ch=c}else if(dsum(r))t.rc=r}
 if(ed){["gv","ch","rc"].forEach(function(k){delete ed[k]});Object.assign(ed,t)}else S.tx.push(t);
 editId=null;save();closeSheet();render()}
function editTx(id){var t=S.tx.filter(function(x){return x.id===id})[0];if(!t)return;kill=null;editId=id;if(t.type==="loan"){var p=S.ppl.filter(function(x){return x.id===t.pid})[0];loanSheet(t,p?p.name:"");return}sheet(t)}
function home(){return bkNudge()+dueCard()+budCard()+tplBar()+pplBar()+home0()}
function accT(){return accT0()+fileCard()+budMgr()+catCard()+tplCard()+recCard()+expCard()+secCard()}

try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
showLock();
load();fix();render();
</script>
